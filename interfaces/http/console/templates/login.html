{{define "content"}}
<section class="login">
  <h1>SyncServer <span>admin</span></h1>
  <form method="post" action="/login" class="stack">
    <label>Name <input name="name" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Log in</button>
  </form>
  <p class="muted">Administrators are created on the server: <code>syncserver admin user create &lt;name&gt;</code>.</p>
</section>
{{end}}
