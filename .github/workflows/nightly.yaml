name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # skip the build when nothing was pushed since the last successful nightly
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}

    steps:
    - name: Compare with last successful nightly
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        last_sha=$(gh run list --repo "${{ github.repository }}" --workflow nightly.yaml --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
        if [ "$last_sha" = "${{ github.sha }}" ]; then
          echo "No changes since last nightly ($last_sha), skipping build"
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

  build:
    name: Build
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    # get date for versioning
    - name: Get date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Build app
      run: CGO_ENABLED=1 GOOS=linux go build -a -ldflags '-linkmode external -extldflags "-static" -X "main.version=nightly-${{ steps.date.outputs.date }}"' -o bin/app cmd/cmd.go

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
        tags: |
          type=schedule,pattern=nightly

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}